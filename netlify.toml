[build]
  command = "npm install && npm run build"
  publish = "client/dist"

[build.environment]
  NODE_VERSION = "24"
  VITE_TRANSPORT = "http"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/game"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
